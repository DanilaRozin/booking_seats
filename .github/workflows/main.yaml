name: Main Booking Seat Workflow
on:
  push:
    branches:
      - deploy

jobs:

  build_app_and_push_to_docker_hub:
    name: Push app Docker image to DockerHub
    runs-on: ubuntu-latest
    steps:

      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker
        id: login_dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push to Docker Hub
        id: push_backend
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/booking_seat:latest

      - name: Send message if build_and_push_to_docker_hub failed
        if: ${{ failure() }}
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            Статус шага login_dockerhub - ${{ steps.login_dockerhub.outcome }}
            Статус шага push_app - ${{ steps.push_backend.outcome }}
            Ошибка при сборке/отправке образа на DockerHub  - ${{ github.repository }}
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

  deploy:
    runs-on: ubuntu-latest
    needs:
      - build_app_and_push_to_docker_hub
    steps:

      - name: Checkout repo
        uses: actions/checkout@v4

      # Копируем docker-compose.production.yaml на production-сервер
      - name: Copy docker-compose.production.yaml via ssh
        uses: appleboy/scp-action@master
      # Передаём параметры для action appleboy/scp-action:
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          # passphrase: ${{ secrets.SSH_PASSPHRASE }}
          source: "infra/docker-compose.production.yaml"
          target: "python_projects/booking_seat"

      - name: Executing remote ssh commands to deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          # passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            cd python_projects/booking_seat

            # Выполняет pull образов с Docker Hub
            echo "Pulling images..."
            sudo docker compose -f docker-compose.production.yaml pull

            # Перезапускает все контейнеры в Docker Compose
            echo "Stopping old containers..."
            sudo docker compose -f docker-compose.production.yaml down

            echo "Starting new containers..."
            sudo docker compose -f docker-compose.production.yaml up -d

            echo "Health check..."
            sudo docker compose -f docker-compose.production.yaml ps

            # Проверка, что все контейнеры запущены
            if sudo docker compose -f docker-compose.production.yaml ps | grep -E '(Exit|Restarting)'; then
              echo "Обнаружены упавшие контейнеры!"
              sudo docker compose -f docker-compose.production.yaml logs --tail=50
              exit 1
            fi

            echo "Deployment completed successfully!!"

      - name: Send telegram message if deploy failed
        if: ${{ failure() }}
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            Ошибка при deploy - ${{ github.repository }}
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

  send_message:
    runs-on: ubuntu-latest
    needs: deploy
    steps:

    - name: Send message
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_TO }}
        token: ${{ secrets.TELEGRAM_TOKEN }}
        message: |
          Deploy успешно выполнен!
          Репозиторий: ${{ github.repositoryUrl }}
          Коммит: ${{ github.event.head_commit.message || 'Сообщение недоступно' }}
          Ссылка на коммит: https://github.com/${{ github.repository }}/commit/${{ github.sha }}
