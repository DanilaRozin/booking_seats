[project]
name = "workspace"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosmtplib>=5.1.2",
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "fastapi>=0.136.1",
    "fastapi-users[sqlalchemy]==13.0.0",
    "loguru>=0.7.3",
    "phonenumbers>=9.0.37",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "sqlalchemy[asyncio]>=2.0.49",
    "uvicorn>=0.46.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "ruff>=0.15.12",
]
[tool.ruff]
extend-exclude = ["alembic/versions"]
force-exclude = true

[tool.ruff.lint]
extend-ignore = ["COM812"]

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["declared_attr", "sqlalchemy.orm.declared_attr"]
