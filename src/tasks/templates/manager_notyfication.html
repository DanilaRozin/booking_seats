<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
</head>
<body style="margin:0; padding:0; background-color:#f2f4f3; font-family: Arial, Helvetica, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f2f4f3; padding:32px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="background-color:#ffffff; border-radius:10px; overflow:hidden; border:1px solid #e6e9e8;">
          <!-- Шапка -->
          <tr>
            <td style="padding:28px 32px; background-color:#ffffff; border-bottom:1px solid #eef1f0;">
              <span style="font-size:18px; font-weight:bold; color:#2f6f5e;">Сервис бронирований {service_name}</span>
            </td>
          </tr>
          <!-- Основной текст -->
          <tr>
            <td style="padding:32px; color:#333333; font-size:15px; line-height:1.6;">
              <p style="margin:0 0 16px 0;">Новая бронь!</p>

              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f7f9f8; border-radius:8px; border:1px solid #eef1f0;">
                <tr>
                  <td style="padding:16px 20px; font-size:14px; color:#5b645f; width:40%;">ID Брони</td>
                  <td style="padding:16px 20px; font-size:14px; color:#2b2f2d; font-weight:bold;">{booking_id}</td>
                </tr>
                <tr>
                  <td style="padding:16px 20px; font-size:14px; color:#5b645f; width:40%;">Имя</td>
                  <td style="padding:16px 20px; font-size:14px; color:#2b2f2d; font-weight:bold;">{username}</td>
                </tr>
                <tr>
                  <td style="padding:16px 20px; font-size:14px; color:#5b645f; width:40%;">Кафе</td>
                  <td style="padding:16px 20px; font-size:14px; color:#2b2f2d; font-weight:bold;">{cafe_name}</td>
                </tr>
                <tr>
                  <td style="padding:0 20px 16px 20px; font-size:14px; color:#5b645f;">Электронная почта</td>
                  <td style="padding:0 20px 16px 20px; font-size:14px; color:#2b2f2d; font-weight:bold;">{user_email}</td>
                </tr>
                <tr>
                  <td style="padding:0 20px 16px 20px; font-size:14px; color:#5b645f;">Телефон</td>
                  <td style="padding:0 20px 16px 20px; font-size:14px; color:#2b2f2d; font-weight:bold;">{user_phone}</td>
                </tr>
                <tr>
                  <td style="padding:0 20px 16px 20px; font-size:14px; color:#5b645f;">Кол-во гостей</td>
                  <td style="padding:0 20px 16px 20px; font-size:14px; color:#2b2f2d; font-weight:bold;">{number_of_guests}</td>
                </tr>
                <tr>
                  <td style="padding:0 20px 16px 20px; font-size:14px; color:#5b645f;">Дата</td>
                  <td style="padding:0 20px 16px 20px; font-size:14px; color:#2b2f2d; font-weight:bold;">{date_booking}</td>
                </tr>
                <tr>
                  <td style="padding:0 20px 20px 20px; font-size:14px; color:#5b645f;">Начало</td>
                  <td style="padding:0 20px 20px 20px; font-size:14px; color:#2b2f2d; font-weight:bold;">{start_time_booking}</td>
                </tr>
              </table>
            </td>
          </tr>
          <!-- Футер -->
          <tr>
            <td style="padding:20px 32px; background-color:#f7f9f8; border-top:1px solid #eef1f0; color:#8a938e; font-size:12px; line-height:1.5; text-align:center;">
              © 2026 {service_name}.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
