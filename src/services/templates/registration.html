<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Уведомление</title>
</head>
<body style="margin:0; padding:0; background-color:#f2f4f3; font-family: Arial, Helvetica, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f2f4f3; padding:32px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="background-color:#ffffff; border-radius:10px; overflow:hidden; border:1px solid #e6e9e8;">
          <!-- Шапка -->
          <tr>
            <td style="padding:28px 32px; background-color:#ffffff; border-bottom:1px solid #eef1f0;">
              <span style="font-size:18px; font-weight:bold; color:#2f6f5e;">Сервис бронирований Booking Seats</span>
            </td>
          </tr>
          <!-- Основной текст -->
          <tr>
            <td style="padding:32px; color:#333333; font-size:15px; line-height:1.6;">
              <p style="margin:0 0 16px 0;">Здравствуйте!</p>
              <p style="margin:0;">{text}</p>
            </td>
          </tr>
          <!-- Футер -->
          <tr>
            <td style="padding:20px 32px; background-color:#f7f9f8; border-top:1px solid #eef1f0; color:#8a938e; font-size:12px; line-height:1.5; text-align:center;">
              © 2026 Booking Seats.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
